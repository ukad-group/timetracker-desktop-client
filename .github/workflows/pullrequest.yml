name: pullrequest CI

on:
  push:
    branches: [ "master", "beta" ]
  pull_request:
    branches: [ "master", "beta" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
